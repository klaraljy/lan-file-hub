name: backend

# 注意：CMakePresets.json 里的 vcpkg toolchain 是 Windows 本机路径，
# 所以 CI 里不用 presets，直接给 cmake 传参数（见下面的「配置」步骤）。
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'migrations/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'migrations/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 clang-format（固定 19.1.0）
        # 必须与开发机版本一致：不同版本的换行对齐与 CJK 宽度判定不同，
        # 会出现"本地通过、CI 失败"（曾经真的踩到过）。
        run: python3 -m pip install --user 'clang-format==19.1.0'

      - name: 检查格式
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          clang-format --version
          mapfile -t files < <(git ls-files 'backend/**.cpp' 'backend/**.h' 'backend/**.hpp')
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有 C++ 源文件，跳过"
            exit 0
          fi
          clang-format --dry-run --Werror --style=file "${files[@]}"

  build-and-test:
    name: build & test
    runs-on: ubuntu-24.04
    # 集成测试打真实数据库：用服务容器跑，避免"没有 DB 就跳过"的假通过
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lan_file_hub
          POSTGRES_PASSWORD: lan_file_hub_ci
          POSTGRES_DB: lan_file_hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lan_file_hub -d lan_file_hub"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      # 集成测试的数据库/缓存配置（测试也会读 .env，见下面「准备测试配置」）
      DATABASE_URL: postgresql://lan_file_hub:lan_file_hub_ci@127.0.0.1:5432/lan_file_hub
      REDIS_URL: redis://127.0.0.1:6379/0
      LAN_FILE_HUB_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl zip unzip tar pkg-config

      - name: 缓存 vcpkg 二进制产物
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: 安装 vcpkg
        run: |
          # runner 网络抖动会让 clone 失败（exit 128）：重试几次再放弃
          for attempt in 1 2 3; do
            if git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"; then
              break
            fi
            echo "vcpkg clone 第 $attempt 次失败，重试…"
            rm -rf "$VCPKG_ROOT"
            sleep 10
          done
          test -d "$VCPKG_ROOT/.git" || { echo "vcpkg 克隆失败"; exit 1; }
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: 配置
        run: |
          cmake -S . -B build/debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: 编译
        run: cmake --build build/debug

      - name: 准备测试配置并跑迁移
        run: |
          # 测试夹具读 .env；这里的口令只用于 CI 的一次性数据库
          cat > .env <<'EOF'
          APP_ENV=test
          HTTP_PORT=8080
          DATABASE_URL=postgresql://lan_file_hub:lan_file_hub_ci@127.0.0.1:5432/lan_file_hub
          REDIS_URL=redis://127.0.0.1:6379/0
          STORAGE_ROOT=./storage
          JWT_SECRET=ci-only-secret-not-used-anywhere-else-0123456789
          EOF
          mkdir -p storage
          ./build/debug/bin/lan_file_hub_migrate --migrations migrations --env-file .env

      - name: 测试
        run: ctest --test-dir build/debug --output-on-failure
