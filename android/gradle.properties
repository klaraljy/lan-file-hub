# Gradle 构建参数（局域网快传 / Android）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 依赖下载默认**直连**（实测本机直连 Maven Central / Google Maven 正常）。
# 需要走本机代理时：.\scripts\build-android.ps1 -UseProxy
#   （注意：把代理写死在这里会导致"代理一关就构建失败"，所以不写死）

# 不使用 AndroidX（本 App 只用系统 View，没有 AppCompat/Material 依赖）
android.useAndroidX=false
android.nonTransitiveRClass=true
