// 局域网快传（Android 端内置轻量分享服务）—— 根构建脚本。
//
// 为什么用 Java 而不是 Kotlin：本机 Gradle 缓存里已有 AGP 8.5.2，但**没有** Kotlin Gradle 插件，
// 用 Kotlin 会额外下载几百 MB；这个 App 只有一个 Activity + 一个 HTTP 服务，Java 完全够用。
buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.5.2'
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
  }
}

tasks.register('clean', Delete) {
  delete rootProject.layout.buildDirectory
}
